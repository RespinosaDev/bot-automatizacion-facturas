name: tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tesseract con el idioma español (para los tests de OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr-spa
      - run: pip install -r requirements.txt
      - run: python -m pytest -v
